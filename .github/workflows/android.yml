name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteWebManager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/debug/app-debug.apk "RemoteWebManager-${{ github.ref_name }}.apk"
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "RemoteWebManager ${{ github.ref_name }}" --notes "自动构建的安装包，应用内「检查更新」可直接下载。" "RemoteWebManager-${{ github.ref_name }}.apk"
